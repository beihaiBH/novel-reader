<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🌙 404 | 页面迷路了</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #1a1410, #2c1810);
  font-family: "Noto Serif SC", serif; color: #e8ddd0; text-align: center; padding: 20px;
}
.card {
  max-width: 360px; animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}
.icon { font-size: 64px; margin-bottom: 16px; display: block; }
h1 { font-size: 48px; font-weight: 700; margin-bottom: 4px; background: linear-gradient(135deg, #c4a882, #e8c888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
p { font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 24px; line-height: 1.6; }
.btn {
  display: inline-block; padding: 12px 32px; border-radius: 30px;
  background: linear-gradient(135deg, #c4a882, #a08060); color: #fff;
  text-decoration: none; font-size: 14px; font-weight: 600;
  transition: all 0.25s; font-family: inherit;
  box-shadow: 0 4px 20px rgba(196,168,130,0.2);
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(196,168,130,0.3); }
.stars { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.star {
  position: absolute; width: 2px; height: 2px; background: #fff;
  border-radius: 50%; animation: twinkle 2s ease-in-out infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 0.8; }
}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="card">
  <span class="icon">🌙</span>
  <h1>404</h1>
  <p>页面像是被猫叼走了...<br>要不回去看看？</p>
  <a href="/" class="btn">🏠 回首页</a>
  <br><br>
  <a href="/001/" style="color:rgba(255,255,255,0.3);font-size:12px;text-decoration:none">去阅读小说</a>
</div>
<script>
(function() {
  var c = document.getElementById('stars');
  for (var i = 0; i < 50; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = Math.random() * 3 + 's';
    s.style.width = s.style.height = (1 + Math.random() * 2) + 'px';
    c.appendChild(s);
  }
})();
</script>
</body>
</html>
